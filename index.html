<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>Boucle D+</title>
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Carte : touche un point pour choisir le départ"></div>
      <aside id="panel">
        <header>
          <h1>Boucle D+</h1>
          <p class="sub" id="zone-info">Chargement des données…</p>
        </header>
        <form id="form">
          <label>Région
            <select id="region"></select>
          </label>
          <p class="hint" id="hint">Touche la carte pour placer le départ.</p>
          <label>Objectif
            <select id="objectif">
              <option value="cible">D+ visé</option>
              <option value="max">D+ maximal</option>
            </select>
          </label>
          <div class="row">
            <label>Distance (km)
              <input id="distance" type="number" inputmode="decimal" min="1" max="60" step="0.5" value="12" required />
            </label>
            <label id="dplus-label">D+ (m)
              <input id="dplus" type="number" inputmode="numeric" min="0" max="4000" step="10" value="400" required />
            </label>
          </div>
          <fieldset id="zone-box">
            <legend>Zone</legend>
            <div class="row">
              <label>Forme
                <select id="zone-type">
                  <option value="aucune">Aucune</option>
                  <option value="cercle">Cercle autour du départ</option>
                  <option value="polygone">Zone dessinée</option>
                </select>
              </label>
              <label id="rayon-label">Rayon (km)
                <input id="rayon" type="number" inputmode="decimal" min="0.3" max="15" step="0.1" value="2" />
              </label>
            </div>
            <div class="row" id="dessin-box" hidden>
              <button id="dessiner" type="button" class="secondaire">Dessiner la zone</button>
              <button id="effacer" type="button" class="secondaire">Effacer</button>
            </div>
            <label class="case" id="allers-retours-label"><input id="allers-retours" type="checkbox" /> Autoriser les allers-retours (côte répétée)</label>
          </fieldset>
          <label>Terrain
            <select id="terrain">
              <option value="mixte">Mixte</option>
              <option value="sentiers">Sentiers</option>
              <option value="route">Route</option>
            </select>
          </label>
          <button id="go" type="submit" disabled>Générer les boucles</button>
        </form>
        <p id="status" role="status"></p>
        <button id="essayer" type="button" hidden></button>
        <ol id="results"></ol>
        <section id="profile-box" hidden>
          <h2>Profil</h2>
          <svg id="profile" viewBox="0 0 320 120" preserveAspectRatio="none" role="img" aria-label="Profil altimétrique"></svg>
          <p class="sub" id="profile-legend"></p>
        </section>
        <footer class="sub" id="credits"></footer>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
